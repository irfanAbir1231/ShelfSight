services:
  - type: web
    name: shelfsight-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r ai_service/requirements.txt
    startCommand: uvicorn ai_service.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: SHELFSIGHT_OUTPUT_DIR
        value: /tmp/shelfsight-output
